name: Gerar APK mercado_v0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential \
            ccache libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv setuptools

      - name: Gerar APK
        run: buildozer -v android debug

      - name: Renomear para mercado_v0.apk
        run: cp bin/*.apk mercado_v0.apk

      - name: Disponibilizar o APK
        uses: actions/upload-artifact@v4
        with:
          name: mercado_v0
          path: mercado_v0.apk
